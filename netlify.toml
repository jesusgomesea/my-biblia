# Este arquivo existe para limitar a taxa da rota publica que consome recurso
# pago: a geracao de plano, que gasta cota do Gemini. O restante da
# configuracao do Next.js continua por conta do Netlify — nao acrescente build
# command, publish directory nem versao do adaptador aqui.
#
# O cadastro nao aparece mais aqui: com o Netlify Identity ele deixou de ser
# uma rota nossa (vai direto para /.netlify/identity) e o proprio Identity
# cuida do abuso. Isso liberou um dos dois slots de rate limit do plano
# gratuito, que continua permitindo duas regras por projeto.
[[redirects]]
  from = "/api/planos/gerar"
  to = "/api/planos/gerar"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]
