# Este arquivo existe para limitar a taxa de rotas públicas que consomem
# recursos pagos ou de storage — geração de plano (cota Gemini) e cadastro
# (Netlify Blobs / bots). O restante da configuração do Next.js continua
# por conta do Netlify — não acrescente build command, publish directory
# nem versão do adaptador aqui.
#
# O plano gratuito permite duas regras deste tipo por projeto.
[[redirects]]
  from = "/api/planos/gerar"
  to = "/api/planos/gerar"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/auth/cadastro"
  to = "/api/auth/cadastro"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]
